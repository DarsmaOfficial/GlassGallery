name: Build Glass Gallery APK

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Enforce no-network permission invariant
        run: bash tools/check_manifest_permissions.sh app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GlassGallery-release-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload R8 mapping files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GlassGallery-mapping-release-${{ github.sha }}
          path: app/build/outputs/mapping/release/
          if-no-files-found: error
          retention-days: 90

      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest release build (${{ github.sha }})"
          prerelease: true
          make_latest: false
          body: |
            R8-optimised, resource-shrunk release build from the most recent push to `main`.
            Commit: ${{ github.sha }}
            This APK is signed with a CI test key which changes between builds, so you must UNINSTALL the app before installing this APK over an older one.
          files: app/build/outputs/apk/release/app-release.apk
