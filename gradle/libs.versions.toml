[versions]
agp                       = "8.7.0"
kotlin                    = "2.1.0"
composeBom                = "2024.12.01"
activityCompose           = "1.10.0"
lifecycleViewmodelCompose = "2.8.7"
navigationCompose         = "2.8.5"
material3                 = "1.3.1"
animation                 = "1.7.8"
graphicsShapes            = "1.0.1"
media3                    = "1.5.1"
coil                      = "3.0.4"
glance                    = "1.1.1"
mlkitTextRecognition      = "16.0.1"
mlkitImageLabeling        = "17.0.9"

[libraries]
compose-bom                 = { group = "androidx.compose",            name = "compose-bom",                 version.ref = "composeBom" }
compose-ui                  = { group = "androidx.compose.ui",         name = "ui" }
compose-ui-graphics         = { group = "androidx.compose.ui",         name = "ui-graphics" }
compose-ui-tooling          = { group = "androidx.compose.ui",         name = "ui-tooling" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui",         name = "ui-tooling-preview" }
compose-material3           = { group = "androidx.compose.material3",  name = "material3",                   version.ref = "material3" }
compose-animation           = { group = "androidx.compose.animation",  name = "animation",                   version.ref = "animation" }
compose-foundation          = { group = "androidx.compose.foundation", name = "foundation" }
activity-compose            = { group = "androidx.activity",           name = "activity-compose",            version.ref = "activityCompose" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle",          name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
navigation-compose          = { group = "androidx.navigation",         name = "navigation-compose",          version.ref = "navigationCompose" }
graphics-shapes             = { group = "androidx.graphics",           name = "graphics-shapes",             version.ref = "graphicsShapes" }
media3-exoplayer            = { group = "androidx.media3",             name = "media3-exoplayer",            version.ref = "media3" }
media3-ui                   = { group = "androidx.media3",             name = "media3-ui",                   version.ref = "media3" }
coil-compose                = { group = "io.coil-kt.coil3",            name = "coil-compose",                version.ref = "coil" }
coil-video                  = { group = "io.coil-kt.coil3",            name = "coil-video",                  version.ref = "coil" }
glance-appwidget            = { group = "androidx.glance",              name = "glance-appwidget",            version.ref = "glance" }
mlkit-text-recognition      = { group = "com.google.mlkit",             name = "text-recognition",            version.ref = "mlkitTextRecognition" }
mlkit-image-labeling        = { group = "com.google.mlkit",             name = "image-labeling",              version.ref = "mlkitImageLabeling" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

[plugins]
android-application = { id = "com.android.application",             version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
